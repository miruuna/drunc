name: Check for __init__.py files

on: 
  push:
      branches:
        - miruuna/fix-broken-pages


jobs:
  check-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify __init__.py presence
        run: |
          # List directories missing __init__.py (excluding some folders)
          missing=$(find . -type d \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -path './tests' -prune -o \
            -path './docs' -prune -o \
            -not -path '.' \
            -not -exec test -e "{}/__init__.py" \; -print)

          if [ -n "$missing" ]; then
            echo "❌ The following folders are missing __init__.py:"
            echo "$missing"
            exit 1
          else
            echo "✅ All applicable folders contain __init__.py"
          fi
