name: Check for __init__.py files

on: 
  pull_request:

jobs:
  check-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify __init__.py presence
        run: |
          missing=$(find src -mindepth 1 \
            \( -path "src/.git*" \-o \
            -path "src/.github*" -o \
            -path "src/tests*" -o \
            -path "src/docs*" -o \
            -path "src/config*" -o \
            -path "src/drunc/data*" \) -prune -o \
            -type d -exec sh -c '[ ! -e "$1/__init__.py" ] && echo "$1"' _ {} \;)

          if [ -n "$missing" ]; then
            echo "following directories are missing __init__.py:"
            echo "$missing"
            exit 1
          else
            echo "All applicable directories contain __init__.py"
          fi